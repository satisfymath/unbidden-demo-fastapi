# The whole application on one machine: PostgreSQL, the migrations, and the API with the React frontend inside.
# Every value here is for a local demo bound to 127.0.0.1; nothing here is a real secret.
name: unbidden-demo

x-app-env: &app-env
  PROJECT_NAME: Teamboard
  SECRET_KEY: demo-only-secret-key-not-for-production
  FIRST_SUPERUSER: admin@example.com
  FIRST_SUPERUSER_PASSWORD: demo-admin-password
  POSTGRES_PASSWORD: demo-db-password
  DATABASE_URL: postgresql://postgres:demo-db-password@db:5432/app
  EMAILS_FROM_EMAIL: noreply@example.com
  FRONTEND_HOST: http://127.0.0.1:8100

x-app-build: &app-build
  context: .
  dockerfile: backend/Dockerfile
  args:
    REVISION: ${REVISION:-unknown}

services:
  db:
    image: postgres:18
    command: ["postgres", "-c", "log_min_duration_statement=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      retries: 20
      start_period: 30s
      timeout: 5s
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: demo-db-password
      POSTGRES_DB: app

  prestart:
    image: unbidden-demo-backend:latest
    build: *app-build
    command: bash scripts/prestart.sh
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env

  backend:
    image: unbidden-demo-backend:latest
    build: *app-build
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8100:8000"
    environment: *app-env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app-db-data:
