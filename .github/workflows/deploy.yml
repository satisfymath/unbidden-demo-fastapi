# Deploys one commit to the demo machine, where a self-hosted runner with the label `demo-fst` lives.
#
# Only a dispatch deploys: a person, or Unbidden through scripts/deploy-via-github.sh. Pull requests never reach this
# runner; they run on GitHub's machines (ci), and the repository requires approval for outside contributors.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: The commit to deploy
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, demo-fst]
    timeout-minutes: 20
    env:
      REVISION: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Build and start the stack
        run: docker compose up -d --build --wait backend
      - name: Health
        run: curl -fsS --retry 5 --retry-delay 3 http://127.0.0.1:8100/api/v1/utils/health-check/
